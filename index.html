<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FRANKSTACK | Portfolio Teaser</title>
    <meta name="description" content="A premium, minimal portfolio teaser by FRANKSTACK">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #000000;
            color: #ffffff;
            overflow-x: hidden;
        }

        /* Smooth Entrance Fade-In */
        .fade-in {
            animation: fadeIn 1.5s ease-out forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Floating Image Animation */
        .float-anim {
            animation: floating 6s ease-in-out infinite;
        }

        @keyframes floating {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-15px); }
            100% { transform: translateY(0px); }
        }

        /* Particle/Glow Background */
        .glow-circle {
            position: absolute;
            width: 300px;
            height: 300px;
            background: rgba(255, 255, 255, 0.05);
            filter: blur(80px);
            border-radius: 50%;
            z-index: -1;
            animation: drift 20s linear infinite;
        }

        @keyframes drift {
            from { transform: translate(0, 0); }
            to { transform: translate(100vw, 100vh); }
        }

        /* Button Pulse */
        .pulse-hover:hover {
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(255, 255, 255, 0.4); }
            70% { box-shadow: 0 0 0 15px rgba(255, 255, 255, 0); }
            100% { box-shadow: 0 0 0 0 rgba(255, 255, 255, 0); }
        }

        /* Glassmorphism */
        .glass-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center relative">

    <div class="glow-circle top-10 left-10"></div>
    <div class="glow-circle bottom-20 right-20" style="animation-delay: -5s; width: 400px; height: 400px;"></div>

    <main class="fade-in container mx-auto px-6 py-12 flex flex-col items-center justify-center min-h-screen text-center">
        
        <div class="glass-card p-8 md:p-12 rounded-3xl max-w-4xl w-full flex flex-col items-center shadow-2xl">
            
            <div class="float-anim mb-12 w-full max-w-md overflow-hidden rounded-2xl shadow-[0_20px_50px_rgba(255,255,255,0.1)] transition-transform duration-700 ease-in-out hover:scale-105">
                <img 
                    src="image.jpg" 
                    alt="Abstract premium visual" 
                    class="w-full h-auto object-cover"
                >
            </div>

            <h1 class="text-4xl md:text-6xl font-black tracking-tighter mb-4 uppercase">
                Frankstack
            </h1>
            <p class="text-gray-400 text-lg md:text-xl mb-10 max-w-lg leading-relaxed">
                Elevating digital experiences through minimal design and high-performance engineering.
            </p>

            <a 
                href="https://frankstack.com.ng" 
                role="button"
                aria-label="Visit My Portfolio"
                class="pulse-hover group relative inline-flex items-center justify-center px-10 py-4 font-bold text-black transition-all duration-500 bg-white border-2 border-white rounded-full hover:bg-transparent hover:text-white transform hover:scale-110 active:scale-95"
            >
                Visit My Portfolio 
            </a>
        </div>

    </main>

    <footer class="pb-8 text-xs tracking-widest text-gray-500 uppercase">
        Built by <span class="text-white font-bold">FRANKSTACK</span>
    </footer>

    <script>
        // Reveal elements on scroll if needed, though this is a single page
        document.addEventListener('DOMContentLoaded', () => {
            console.log("Welcome to FRANKSTACK.");
        });
    </script>
</body>
      </html>
